<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AISec – AI Security Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#060B14;--bg2:#0D1520;--bg3:#111C2B;--card:#0F1A28;--card2:#162032;
--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
--blue:#3B82F6;--blue-dim:rgba(59,130,246,0.12);
--red:#EF4444;--red-dim:rgba(239,68,68,0.12);
--yellow:#F59E0B;--yellow-dim:rgba(245,158,11,0.12);
--green:#10B981;--green-dim:rgba(16,185,129,0.12);
--text:#F1F5F9;--text2:#94A3B8;--text3:#64748B;
--mono:'JetBrains Mono',monospace;--sans:'Space Grotesk',sans-serif;--display:'Syne',sans-serif;
}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(59,130,246,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(59,130,246,0.03) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;z-index:0}
.header{position:sticky;top:0;z-index:100;background:rgba(6,11,20,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-family:var(--display);font-size:1.25rem;font-weight:800;letter-spacing:-0.02em;display:flex;align-items:center;gap:8px;cursor:pointer}
.logo-shield{width:28px;height:28px;background:var(--blue);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px}
.logo span{color:var(--blue)}
.nav{display:flex;gap:4px}
.nav-btn{padding:6px 14px;border:none;background:none;color:var(--text2);font-family:var(--sans);font-size:0.875rem;cursor:pointer;border-radius:6px;transition:all 0.15s}
.nav-btn:hover{color:var(--text);background:var(--card2)}
.nav-btn.active{color:var(--blue);background:var(--blue-dim)}
.hero{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:5rem 2rem 2.5rem;text-align:center}
.hero-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;background:var(--blue-dim);border:1px solid rgba(59,130,246,0.3);border-radius:100px;font-size:0.72rem;color:var(--blue);font-weight:600;margin-bottom:1.5rem;letter-spacing:0.07em;text-transform:uppercase}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--blue);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(1.4)}}
.hero h1{font-family:var(--display);font-size:clamp(2.2rem,5vw,3.8rem);font-weight:800;line-height:1.1;letter-spacing:-0.03em;margin-bottom:1.25rem}
.hero h1 em{font-style:normal;color:var(--blue)}
.hero p{font-size:1.05rem;color:var(--text2);max-width:540px;margin:0 auto 2.5rem;line-height:1.65}
.tool-tabs{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:0 2rem 4rem}
.tabs-header{display:flex;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:1.5rem;max-width:520px;margin-left:auto;margin-right:auto}
.tab-btn{flex:1;padding:10px 16px;border:none;background:none;color:var(--text2);font-family:var(--sans);font-size:0.875rem;font-weight:500;cursor:pointer;border-radius:8px;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:7px}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{background:var(--card2);color:var(--text);border:1px solid var(--border2)}
.tool-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2rem;position:relative;overflow:hidden}
.tool-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--blue),transparent);opacity:0.5}
.input-row{display:flex;gap:12px;margin-bottom:1.25rem}
.url-input{flex:1;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:14px 18px;font-family:var(--mono);font-size:0.875rem;color:var(--text);outline:none;transition:border-color 0.2s}
.url-input:focus{border-color:var(--blue)}
.url-input::placeholder{color:var(--text3);font-family:var(--sans)}
.scan-btn{padding:14px 26px;background:var(--blue);color:#fff;border:none;border-radius:10px;font-family:var(--sans);font-weight:600;font-size:0.9rem;cursor:pointer;transition:all 0.2s;white-space:nowrap;display:flex;align-items:center;gap:8px}
.scan-btn:hover{background:#2563EB;transform:translateY(-1px)}
.scan-btn:active{transform:translateY(0)}
.scan-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.text-area{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:14px 18px;font-family:var(--sans);font-size:0.875rem;color:var(--text);outline:none;resize:vertical;min-height:110px;line-height:1.6;transition:border-color 0.2s;margin-bottom:1rem}

.gauge-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:1.5rem;text-align:center}
.gauge-title{font-size:0.7rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.12em;margin-bottom:1rem}
.gauge-svg{width:190px;height:110px;margin:0 auto 0.75rem;display:block}
.gauge-score{font-family:var(--display);font-size:2.5rem;font-weight:800;line-height:1;margin-bottom:6px}
.verdict-badge{display:inline-block;padding:4px 14px;border-radius:100px;font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.1em}
.verdict-malicious{background:var(--red-dim);color:var(--red);border:1px solid rgba(239,68,68,0.3)}
.verdict-suspicious{background:var(--yellow-dim);color:var(--yellow);border:1px solid rgba(245,158,11,0.3)}
.verdict-safe{background:var(--green-dim);color:var(--green);border:1px solid rgba(16,185,129,0.3)}
.verdict-high_risk{background:var(--red-dim);color:var(--red);border:1px solid rgba(239,68,68,0.3)}
.verdict-low_risk{background:var(--green-dim);color:var(--green);border:1px solid rgba(16,185,129,0.3)}
.verdict-unknown{background:var(--yellow-dim);color:var(--yellow);border:1px solid rgba(245,158,11,0.3)}
.timeline-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:1.5rem}
.timeline-title{font-size:0.7rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.12em;margin-bottom:1.25rem}
.timeline-step{display:flex;gap:12px;margin-bottom:0.875rem;align-items:flex-start}
.timeline-step:nth-child(1){animation:fadeIn 0.3s ease forwards}
.timeline-step:nth-child(2){animation:fadeIn 0.4s ease forwards}
.timeline-step:nth-child(3){animation:fadeIn 0.5s ease forwards}
.timeline-step:nth-child(4){animation:fadeIn 0.6s ease forwards}
.timeline-step:nth-child(5){animation:fadeIn 0.7s ease forwards}
.timeline-step:nth-child(6){animation:fadeIn 0.8s ease forwards}
@keyframes fadeIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
.step-bullet{width:22px;height:22px;border-radius:50%;background:var(--card2);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:700;color:var(--text2);flex-shrink:0;margin-top:1px}
.step-text{font-size:0.85rem;color:var(--text2);line-height:1.5}
.eli5-card{background:var(--blue-dim);border:1px solid rgba(59,130,246,0.2);border-radius:12px;padding:1.25rem;margin-top:1rem;display:flex;gap:12px;align-items:flex-start}
.eli5-card.danger{background:var(--red-dim);border-color:rgba(239,68,68,0.2)}
.eli5-card.warning{background:var(--yellow-dim);border-color:rgba(245,158,11,0.2)}
.eli5-card.success{background:var(--green-dim);border-color:rgba(16,185,129,0.2)}
.eli5-icon{font-size:1.2rem;flex-shrink:0;margin-top:1px}
.eli5-text{font-size:0.88rem;line-height:1.6;color:var(--text)}
.eli5-label{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--blue);font-weight:600;margin-bottom:3px}
.eli5-card.danger .eli5-label{color:var(--red)}
.eli5-card.warning .eli5-label{color:var(--yellow)}
.eli5-card.success .eli5-label{color:var(--green)}
.expandable{margin-top:1rem;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.expandable-hdr{padding:11px 16px;background:var(--bg2);cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-size:0.75rem;color:var(--text3);font-weight:500;letter-spacing:0.05em;text-transform:uppercase;transition:background 0.15s}
.expandable-hdr:hover{background:var(--card2)}
.expandable-body{padding:1rem;background:var(--bg);font-family:var(--mono);font-size:0.75rem;color:var(--text2);line-height:1.8;max-height:280px;overflow-y:auto}
.tech-row{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid var(--border)}
.tech-k{color:var(--text3)}
.tech-v{color:var(--blue)}
.tech-v.red{color:var(--red)}
.tech-v.green{color:var(--green)}
.auth-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.875rem;margin-bottom:1.5rem}
.auth-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:1rem;text-align:center}
.auth-name{font-size:0.7rem;color:var(--text3);text-transform:uppercase;letter-spacing:0.12em;margin-bottom:5px}
.auth-status{font-size:0.85rem;font-weight:600}
.auth-pass{color:var(--green)}
.auth-fail{color:var(--red)}
.auth-missing{color:var(--text3)}
.flags-list{display:flex;flex-direction:column;gap:7px;margin-bottom:1.25rem}
.flag-item{padding:9px 14px;background:var(--red-dim);border:1px solid rgba(239,68,68,0.2);border-radius:8px;font-size:0.84rem;color:var(--text);animation:slideIn 0.25s ease}
.flag-item.warn{background:var(--yellow-dim);border-color:rgba(245,158,11,0.2)}
@keyframes slideIn{from{transform:translateX(-8px);opacity:0}to{transform:translateX(0);opacity:1}}
.url-list{display:flex;flex-direction:column;gap:7px}
.url-item{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:0.78rem}
.url-text{font-family:var(--mono);color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:280px}
.safe-version{background:var(--green-dim);border:1px solid rgba(16,185,129,0.2);border-radius:12px;padding:1.25rem;margin-top:1rem}
.safe-label{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--green);font-weight:600;margin-bottom:5px}
.safe-text{font-size:0.875rem;color:var(--text);line-height:1.6}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2.5rem;gap:0.875rem}
.spinner{width:36px;height:36px;border:3px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:spin 0.75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:var(--text3);font-size:0.84rem}
.model-page{max-width:820px;margin:0 auto;padding:3rem 2rem;position:relative;z-index:1}
.model-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem;margin:2rem 0}
.metric-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.5rem;text-align:center}
.metric-value{font-family:var(--display);font-size:2.25rem;font-weight:800;color:var(--blue)}
.metric-label{font-size:0.78rem;color:var(--text3);margin-top:4px}
.features-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.feature-tag{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:5px 11px;font-size:0.77rem;color:var(--text2);font-family:var(--mono)}
.sec-title{font-family:var(--display);font-size:1.4rem;font-weight:700;margin-bottom:0.6rem;margin-top:2.25rem}
.sec-body{color:var(--text2);line-height:1.7;font-size:0.93rem}
.trust-bar{display:flex;align-items:center;justify-content:center;gap:2rem;padding:2rem;border-top:1px solid var(--border);position:relative;z-index:1;flex-wrap:wrap}
.trust-item{display:flex;align-items:center;gap:6px;font-size:0.78rem;color:var(--text3)}
.trust-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.sec-hdr{font-size:0.72rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--text3);font-weight:600;margin-bottom:0.75rem;margin-top:1.5rem}
.page{animation:fadeUp 0.25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.pf-chips{display:flex;gap:6px;margin-bottom:0.875rem}
.pf-chip{padding:5px 12px;background:var(--bg2);border:1px solid var(--border2);border-radius:100px;font-size:0.78rem;color:var(--text2);cursor:pointer;transition:all 0.15s}
.pf-chip.on{border-color:var(--blue);color:var(--blue);background:var(--blue-dim)}
@media(max-width:600px){.auth-grid{grid-template-columns:1fr}.model-grid{grid-template-columns:1fr}.hero{padding:3rem 1rem 2rem}.tool-tabs{padding:0 1rem 3rem}}
</style>

<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const {useState,useRef}=React;

/* ================================================================
   PURE CLIENT-SIDE ANALYSIS ENGINE — No backend, no API key needed
================================================================ */

const TOP_BRANDS=['google','microsoft','apple','amazon','facebook','paypal','netflix','instagram','twitter','linkedin','dropbox','github','adobe','zoom','slack','salesforce','chase','wellsfargo','bankofamerica','citibank','hsbc','barclays','americanexpress','visa','mastercard','irs','usps','fedex','ups','dhl','ebay','walmart','target','bestbuy','att','verizon','tmobile','comcast','xfinity','spotify','twitch','discord','telegram','whatsapp','outlook','office365','icloud','onedrive','sharepoint','teams'];
const BAD_TLDS=['.tk','.ml','.ga','.cf','.gq','.xyz','.top','.club','.work','.live','.online','.site','.website','.space','.fun','.icu','.buzz','.cyou','.bond','.hair','.monster','.rest','.click','.zip','.mov'];
const HOMOGLYPHS={'rn':'m','vv':'w','0':'o','1':'l','3':'e','4':'a','5':'s','6':'g','8':'b','@':'a','ii':'n','ln':'m'};
const SAFE_DOMAINS=['google.com','microsoft.com','apple.com','amazon.com','github.com','stackoverflow.com','wikipedia.org','youtube.com','linkedin.com','twitter.com','reddit.com','netflix.com','spotify.com','dropbox.com','slack.com','zoom.us','adobe.com','shopify.com','cloudflare.com','anthropic.com','openai.com','facebook.com','instagram.com','discord.com'];

function entropy(s){if(!s)return 0;const f={};for(const c of s)f[c]=(f[c]||0)+1;const n=s.length;return-Object.values(f).reduce((a,v)=>{const p=v/n;return a+p*Math.log2(p)},0)}

function parseURL(raw){
  let u=raw.trim();
  if(!/^https?:\/\//i.test(u))u='https://'+u;
  try{
    const p=new URL(u);
    return{scheme:p.protocol.replace(':',''),host:p.hostname,path:p.pathname,query:p.search,full:u,ok:true};
  }catch{return{scheme:'https',host:u.replace(/^https?:\/\//,'').split('/')[0],path:'/',query:'',full:u,ok:false}}
}

function checkBrand(host){
  const h=host.toLowerCase().replace(/^www\./,'');
  const bare=h.replace(/[^a-z]/g,'');
  for(const b of TOP_BRANDS){
    const bclean=b.replace(/-/g,'');
    // Domain IS the brand exactly — not an impersonation
    if(h===b+'.com'||h===b+'.org'||h===b+'.net')return null;
    // Brand embedded in a different domain
    if(bare.includes(bclean)&&!h.endsWith('.'+b+'.com')){
      const domainRoot=h.split('.').slice(-2).join('.');
      if(!domainRoot.startsWith(b+'.')){
        return{brand:b,method:'brand name embedded in domain'};
      }
    }
  }
  return null;
}

function detectHomoglyphs(host){
  const h=host.toLowerCase().replace(/^www\./,'');
  const found=[];
  for(const[fake,real]of Object.entries(HOMOGLYPHS)){
    if(h.includes(fake))found.push(`'${fake}' looks like '${real}'`);
  }
  return found;
}

function analyzeURL(raw){
  const{scheme,host,path,query,full}=parseURL(raw);
  const hostClean=host.toLowerCase().replace(/^www\./,'');
  
  // Check if it's a known safe domain
  const safeMatch=SAFE_DOMAINS.find(d=>hostClean===d||hostClean.endsWith('.'+d));
  
  const tldMatch=hostClean.match(/\.[a-z]{2,}$/);
  const tld=tldMatch?tldMatch[0]:'';
  const subdomains=hostClean.split('.').slice(0,-2).filter(Boolean);
  const isIP=/^\d{1,3}(\.\d{1,3}){3}$/.test(host);
  const hasAt=full.includes('@');
  const badTLD=BAD_TLDS.includes(tld);
  const domEnt=parseFloat(entropy(hostClean).toFixed(2));
  const pathEnt=parseFloat(entropy(path).toFixed(2));
  const digitRatio=parseFloat(((hostClean.match(/\d/g)||[]).length/Math.max(hostClean.length,1)).toFixed(2));
  const hyphenCount=(hostClean.match(/-/g)||[]).length;
  const brand=checkBrand(hostClean);
  const homos=detectHomoglyphs(hostClean);
  const hasRedirect=/redirect|url=|return=|next=|goto=/i.test(query);
  const isHTTPS=scheme==='https';
  const urlLen=full.length;
  const specialRatio=parseFloat(((full.match(/[^a-zA-Z0-9]/g)||[]).length/Math.max(full.length,1)).toFixed(2));
  const hasDoubleSlash=path.includes('//');
  
  let score=0;
  const timeline=[];
  
  if(safeMatch){
    score=Math.min(12,score);
    timeline.push(`✅ Domain matches known-safe site: ${safeMatch}`);
    const s=score;
    timeline.push(`🔍 URL length is ${urlLen} characters — within normal range`);
    timeline.push(`🔒 Uses ${isHTTPS?'HTTPS (encrypted)':'HTTP (unencrypted)'} connection`);
    timeline.push('✅ Conclusion: No phishing indicators detected');
    return{score:s,verdict:'safe',timeline,explanation:'This URL belongs to a well-known, trusted website. It appears safe to visit.',technical:{host:hostClean,tld,https:isHTTPS,subdomains:subdomains.length,length:urlLen,entropy:domEnt,ip:isIP,brand_impersonation:'none',homoglyphs:'none',suspicious_tld:badTLD}};
  }
  
  // IP address
  if(isIP){
    score+=28;
    timeline.push(`⚠️ URL uses a raw IP address (${host}) instead of a domain name — phishers use this to avoid registering a traceable domain`);
  }
  // @ symbol  
  if(hasAt){
    score+=22;
    timeline.push('⚠️ URL contains "@" symbol — browsers ignore everything before "@", so the visible part may be a decoy');
  }
  // Suspicious TLD
  if(badTLD){
    score+=22;
    timeline.push(`⚠️ TLD "${tld}" is associated with free, anonymous domain registrations — frequently abused by phishers`);
  }
  // Brand impersonation
  if(brand){
    score+=32;
    timeline.push(`🎭 Domain impersonates "${brand.brand}" (${brand.method}) — designed to trick you into trusting a fake site`);
  }
  // Homoglyphs
  if(homos.length){
    score+=Math.min(24,homos.length*12);
    homos.slice(0,2).forEach(h=>timeline.push(`🔡 Lookalike character detected: ${h} — makes fake domain look real at a glance`));
  }
  // URL length
  if(urlLen>100){score+=14;timeline.push(`🔍 URL is very long (${urlLen} chars) — legitimate sites rarely need URLs this complex`)}
  else if(urlLen>75){score+=7;timeline.push(`🔍 URL length (${urlLen} chars) is above average`)}
  // High entropy
  if(domEnt>4.2){score+=14;timeline.push(`🎲 Domain has high randomness score (${domEnt}) — suggests auto-generated attack infrastructure`)}
  else if(domEnt>3.5){score+=6}
  // Many subdomains
  if(subdomains.length>3){score+=12;timeline.push(`🔍 ${subdomains.length} subdomain levels detected — attackers nest subdomains to bury the real registrant domain`)}
  else if(subdomains.length>1){score+=5;timeline.push(`🔍 Multiple subdomains (${subdomains.join('.')}) — verify the root domain carefully`)}
  // No HTTPS
  if(!isHTTPS){score+=11;timeline.push('🔓 Uses HTTP (not HTTPS) — your data travels unencrypted and can be intercepted')}
  // Redirect param
  if(hasRedirect){score+=10;timeline.push('↩️ Contains redirect parameter — may pass through a legitimate site before landing on a malicious one')}
  // High digit ratio

const URGENCY=[['immediately','Urgency manipulation'],['urgent','Urgency manipulation'],['verify your','Credential harvesting'],['password expired','Credential harvesting'],['account suspended','Fear tactic'],['click here','Direct action pressure'],['limited time','Scarcity pressure'],['act now','Urgency escalation'],['final notice','Urgency escalation'],['unusual sign','Fear tactic'],['unauthorized access','Fear tactic'],['security alert','Fear tactic'],['gift card','Payment diversion'],['wire transfer','Payment fraud'],['invoice attached','Malware delivery'],['delivery failed','Package scam'],['you have won','Prize scam'],['confirm your','Credential harvesting'],['update required','Credential harvesting'],['action required','Urgency pressure']];
const AUTH_ROLES=['ceo','president','director','hr department','it department','it support','finance team','payroll','microsoft support','google security','apple id','internal audit','compliance'];

function analyzeEmail(text){
  const lines=text.split('\n');
  const headers={};
  let bodyStart=0;
  for(let i=0;i<lines.length;i++){
    if(lines[i].trim()===''){bodyStart=i+1;break}
    const m=lines[i].match(/^([\w-]+):\s*(.+)/);
    if(m)headers[m[1].toLowerCase()]=m[2];
  }
  const body=lines.slice(bodyStart).join('\n');
  const fromH=headers['from']||'';
  const subject=headers['subject']||'(no subject)';
  const replyTo=headers['reply-to']||'';
  const spfH=headers['received-spf']||'';
  const dkim=headers['dkim-signature']||'';
  const dmarc=headers['authentication-results']||'';
  
  const spfStatus=spfH.toLowerCase().includes('pass')?'pass':spfH.toLowerCase().includes('fail')?'fail':'missing';
  const dkimPresent=dkim.length>20;
  const dmarcStatus=dmarc.toLowerCase().includes('pass')?'pass':dmarc.toLowerCase().includes('fail')?'fail':'missing';
  
  const textAll=(fromH+' '+subject+' '+body).toLowerCase();
  const urgencyFound=URGENCY.filter(([p])=>textAll.includes(p)).map(([p,t])=>({phrase:p,tactic:t,context:'...'+body.substring(Math.max(0,body.toLowerCase().indexOf(p)-25),body.toLowerCase().indexOf(p)+p.length+25)+'...'}));
  const authRolesFound=AUTH_ROLES.filter(r=>textAll.includes(r)).map(r=>r.charAt(0).toUpperCase()+r.slice(1));
  
  // From/reply-to mismatch
  const fromDom=(fromH.match(/@([\w.-]+)/)||[])[1]||'';
  const replyDom=(replyTo.match(/@([\w.-]+)/)||[])[1]||'';
  const mismatch=fromDom&&replyDom&&fromDom.toLowerCase()!==replyDom.toLowerCase();
  
  // Extract URLs
  const urlRegex=/https?:\/\/[^\s<>"']+|www\.[^\s<>"']+/gi;
  const rawUrls=[...new Set((text.match(urlRegex)||[]).map(u=>u.replace(/[.,;:!?)\]>]+$/,'')))].slice(0,5);
  const urlResults=rawUrls.map(u=>{try{const r=analyzeURL(u);return{url:u,score:r.score,verdict:r.verdict}}catch{return{url:u,score:50,verdict:'unknown'}}});
  
  let score=0;
  if(spfStatus!=='pass')score+=18;
  if(!dkimPresent)score+=12;
  if(dmarcStatus!=='pass')score+=12;
  score+=Math.min(28,urgencyFound.length*7);
  score+=Math.min(18,authRolesFound.length*9);
  if(mismatch)score+=20;
  urlResults.forEach(u=>{if(u.verdict==='malicious')score+=25;else if(u.verdict==='suspicious')score+=12});
  score=Math.min(100,score);
  
  const verdict=score>=65?'malicious':score>=35?'suspicious':'safe';
  const action=score>=65?'Delete this email immediately and report it to your IT security team. Do not click any links or open attachments.':score>=35?'Treat with extreme caution. Verify the sender identity through a separate channel before taking any action.':'No immediate action required, but always verify unexpected requests through official channels.';
  
  return{score,verdict,recommended_action:action,headers:{from:fromH,subject,date:headers['date']||''},authentication:{spf:{status:spfStatus,pass:spfStatus==='pass'},dkim:{status:dkimPresent?'present':'missing',present:dkimPresent},dmarc:{status:dmarcStatus,pass:dmarcStatus==='pass'}},urgency_phrases_detected:urgencyFound,authority_impersonation:authRolesFound,sender_mismatch:{mismatch,from_domain:fromDom,reply_to_domain:replyDom},urls_found:urlResults,summary:`Found ${urgencyFound.length} manipulation tactics, ${authRolesFound.length} role references, and ${urlResults.filter(u=>['malicious','suspicious'].includes(u.verdict)).length} suspicious URLs.`};
}

const ROLE_MAP={CEO:['ceo','chief executive','founder','president'],HR:['hr:','hr team','hr department','human resources','people ops'],IT:['it support','it department','helpdesk','help desk','tech support','sysadmin'],Finance:['cfo','chief financial','finance team','accounting','payroll'],Legal:['legal','compliance','counsel'],Security:['security team','infosec','security alert']};
const CHAT_TACTICS=[['gift card','Payment diversion',38],['wire transfer','Payment fraud',38],['bitcoin','Crypto payment',32],['itunes','Gift card scam',32],['amazon gift','Gift card scam',30],['click here','Phishing link',20],['click the link','Phishing link',20],['verify your','Credential theft',25],['update your password','Credential theft',25],['keep this confidential','Secrecy request',22],["don't tell",'Secrecy request',22],['between us','Secrecy request',18],['immediately','Urgency',10],['right now','Urgency',10],['asap','Urgency',10],['urgent','Urgency',14],['suspended','Fear tactic',20],['personal email','Channel bypass',16]];
const SAFE_TPLS={payment:'Real {role} will never request payments, gift cards, or wire transfers via chat. Call {role} directly using a number from your internal directory — never a number from this message.',credentials:'Real {role} will never ask for your password or authentication codes through chat. If you receive such a request, report it to IT Security immediately.',secrecy:'Any legitimate request will not ask you to keep it secret. This is a critical social engineering red flag — report this conversation to your manager and IT Security now.',link:'Before clicking any link from {role} in chat, hover over the URL and confirm it matches your company\'s official domain. When in doubt, navigate directly to the service yourself.',generic:'Real {role} communications about sensitive actions happen through verified channels. If in doubt, call {role} directly through a number you already know.'};

function analyzeChat(msg,platform){
  const m=msg.toLowerCase();
  const impersonation=[];
  for(const[role,kws]of Object.entries(ROLE_MAP)){
    for(const kw of kws){
      if(m.includes(kw)){impersonation.push({role,keyword:kw,severity:['CEO','IT','Finance'].includes(role)?'high':'medium'});break}
    }
  }
  const tactics=CHAT_TACTICS.filter(([p])=>m.includes(p)).map(([p,t,w])=>({phrase:p,tactic:t,weight:w,context:'...'+msg.substring(Math.max(0,m.indexOf(p)-20),m.indexOf(p)+p.length+20)+'...'}));
  const rawUrls=[...(msg.match(/https?:\/\/[^\s]+|www\.[^\s]+/gi)||[])].slice(0,3);
  const urlResults=rawUrls.map(u=>{try{const r=analyzeURL(u.trim());return{url:u,score:r.score,verdict:r.verdict}}catch{return{url:u,score:50,verdict:'unknown'}}});
  
  let score=0;
  impersonation.forEach(i=>score+=i.severity==='high'?26:16);
  tactics.forEach(t=>score+=t.weight);
  urlResults.forEach(u=>{if(u.verdict==='malicious')score+=30;else if(u.verdict==='suspicious')score+=14});
  score=Math.min(100,score);
  
  const verdict=score>=65?'high_risk':score>=35?'suspicious':'low_risk';
  const role=impersonation[0]?.role||'this sender';
  
  const hasPayment=tactics.some(t=>['Payment diversion','Payment fraud','Gift card scam','Crypto payment'].includes(t.tactic));
  const hasCreds=tactics.some(t=>t.tactic==='Credential theft');
  const hasSecrecy=tactics.some(t=>t.tactic==='Secrecy request');
  const hasLink=urlResults.length>0;
  const tpl=hasSecrecy?'secrecy':hasPayment?'payment':hasCreds?'credentials':hasLink?'link':'generic';
  const safe_version=SAFE_TPLS[tpl].replace(/\{role\}/g,role);
  
  const flags=[];
  if(impersonation.length)flags.push(`🎭 Impersonates: ${[...new Set(impersonation.map(i=>i.role))].join(', ')}`);
  if(hasPayment)flags.push('💸 Requests financial action (gift cards / wire transfer)');
  if(hasCreds)flags.push('🔑 Attempts to harvest credentials');
  if(tactics.some(t=>t.tactic==='Urgency'))flags.push('⏰ Applies urgency pressure to short-circuit your judgment');
  if(hasSecrecy)flags.push('🤫 Requests secrecy — a hallmark of social engineering');
  if(urlResults.some(u=>['malicious','suspicious'].includes(u.verdict)))flags.push(`🔗 Contains ${urlResults.filter(u=>['malicious','suspicious'].includes(u.verdict)).length} suspicious link(s)`);
  
  const explanation=score>=65?`This message is a social engineering attack.${impersonation.length?' It impersonates '+role+' to gain your trust.':''} Ignore it and report to your security team.`:score>=35?'This message shows suspicious patterns. Verify the sender\'s identity through a completely separate channel before taking any action.':'This message appears normal, but always verify sensitive requests through official channels before acting.';
  
  return{score,verdict,flags,explanation,safe_version,impersonation_detected:impersonation,tactics_detected:tactics,urls_scanned:urlResults,platform,summary:`${impersonation.length} impersonation, ${tactics.length} manipulation tactics, ${urlResults.length} URLs.`};
}

  {label:'💰 Payroll scam',msg:'HR: All employees must update their payroll bank details immediately. New compliance requirement — click here: http://hr-payroll-update.xyz/form\n\nDeadline is today.',platform:'slack'},
  {label:'👔 CEO gift card',msg:"From CEO: Hi, I need you to buy 5x $200 Amazon gift cards for client gifts urgently. Keep this between us — I'm in a meeting. Send me the codes ASAP.",platform:'teams'},
  {label:'🔑 IT VPN scam',msg:'IT Support: Your VPN license expires today. Click immediately to renew: http://vpn-renew.tk/login — enter your company credentials to restore access.',platform:'slack'},
];

function ChatCheck(){
  const[msg,setMsg]=useState('');
  const[platform,setPlatform]=useState('slack');
  const[result,setResult]=useState(null);
  const[loading,setLoading]=useState(false);

  const scan=async(m,p)=>{
    const target=m||msg;if(!target.trim())return;
    setLoading(true);setResult(null);
    await new Promise(r=>setTimeout(r,500));
    try{setResult(analyzeChat(target,p||platform))}catch(e){console.error(e)}
    setLoading(false);
  };

  const loadDemo=d=>{setMsg(d.msg);setPlatform(d.platform);scan(d.msg,d.platform)};
  const scoreColor=result?(result.score>=65?'var(--red)':result.score>=35?'var(--yellow)':'var(--green)'):'var(--blue)';

  return React.createElement('div',{className:'page'},[
    React.createElement('div',{key:'demo',className:'demo-strip'},[
      React.createElement('span',{key:'l',className:'demo-label'},'Try demo:'),
      ...CHAT_DEMOS.map(d=>React.createElement('button',{key:d.label,className:'demo-chip',onClick:()=>loadDemo(d)},d.label)),
    ]),
    React.createElement('div',{key:'pf',className:'pf-chips'},
      ['slack','teams','email','sms'].map(p=>React.createElement('button',{key:p,className:`pf-chip${platform===p?' on':''}`,onClick:()=>setPlatform(p)},p.charAt(0).toUpperCase()+p.slice(1)))
    ),
    React.createElement('textarea',{key:'ta',className:'text-area',placeholder:`Paste a suspicious ${platform} message here...`,value:msg,onChange:e=>setMsg(e.target.value),rows:4}),
    React.createElement(ScanBtn,{key:'btn',loading,disabled:!msg.trim(),onClick:()=>scan()},'🔍 Check Message'),
    loading&&React.createElement('div',{key:'load',className:'loading'},[
      React.createElement('div',{key:'s',className:'spinner'}),
      React.createElement('div',{key:'t',className:'loading-text'},'Detecting impersonation and social engineering patterns...'),
    ]),
    result&&React.createElement('div',{key:'res',className:'results'},[
      React.createElement('div',{key:'hdr',style:{display:'flex',alignItems:'center',gap:12,marginBottom:'1.25rem'}},[
        React.createElement('div',{key:'circle',style:{width:54,height:54,borderRadius:'50%',background:result.score>=65?'var(--red-dim)':result.score>=35?'var(--yellow-dim)':'var(--green-dim)',border:`2px solid ${scoreColor}`,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'var(--display)',fontWeight:800,fontSize:'1.05rem',color:scoreColor,flexShrink:0}},`${result.score}`),
        React.createElement('div',{key:'info'},[
          React.createElement('span',{key:'b',className:`verdict-badge verdict-${result.verdict}`},result.verdict.replace('_',' ').toUpperCase()),
          React.createElement('div',{key:'p',style:{fontSize:'0.75rem',color:'var(--text3)',marginTop:3}},`Analyzed as ${platform} message`),
        ]),
      ]),
      result.flags?.length>0&&[
        React.createElement('div',{key:'ft',className:'sec-hdr'},'Risk Flags'),
        React.createElement('div',{key:'fl',className:'flags-list'},
          result.flags.map((f,i)=>React.createElement('div',{key:i,className:'flag-item'},f))
        ),
      ],
      result.urls_scanned?.length>0&&[
        React.createElement('div',{key:'ut',className:'sec-hdr'},'Links Detected'),
        React.createElement('div',{key:'ul',className:'url-list'},
          result.urls_scanned.map((u,i)=>React.createElement('div',{key:i,className:'url-item'},[
            React.createElement('span',{key:'u',className:'url-text'},u.url),
            React.createElement('span',{key:'b',className:`verdict-badge verdict-${u.verdict}`,style:{fontSize:'0.62rem',padding:'2px 8px',flexShrink:0}},u.verdict),
          ]))
        ),
      ],
      React.createElement('div',{key:'eli',className:`eli5-card ${result.score>=65?'danger':result.score>=35?'warning':'success'}`,style:{marginTop:'1rem'}},[
        React.createElement('div',{key:'i',className:'eli5-icon'},result.score>=65?'🚨':result.score>=35?'⚠️':'✅'),
        React.createElement('div',{key:'t'},[
          React.createElement('div',{key:'l',className:'eli5-label'},'What You Should Know'),
          React.createElement('div',{key:'tx',className:'eli5-text'},result.explanation),
        ]),
      ]),
      result.safe_version&&React.createElement('div',{key:'sv',className:'safe-version'},[
        React.createElement('div',{key:'l',className:'safe-label'},'🛡️ What to do instead'),
        React.createElement('div',{key:'t',className:'safe-text'},result.safe_version),
      ]),
    ]),
  ]);
}

/* ---- MODEL CARD ---- */
const FEATURES=['url_length','domain_length','path_length','special_char_ratio','digit_ratio','hyphen_count','dot_count','has_at_symbol','has_ip_address','has_https','subdomain_count','suspicious_tld','domain_entropy','path_entropy','brand_mismatch','homoglyph_score','query_param_count','has_redirect_param','url_shortener','domain_age_proxy','double_slash_path'];

function ModelCard(){
  return React.createElement('div',{className:'model-page page'},[
    React.createElement('div',{key:'badge',className:'hero-badge'},[React.createElement('div',{key:'p',className:'pulse'}),'Transparency Report']),
    React.createElement('h1',{key:'h1',style:{fontFamily:'var(--display)',fontSize:'2rem',fontWeight:800,letterSpacing:'-0.02em',marginBottom:'0.5rem'}},'Model Card'),
    React.createElement('p',{key:'sub',style:{color:'var(--text2)',marginBottom:'0.5rem'}},'AISec Phishing Detection — XGBoost Classifier v1.0'),
    React.createElement('div',{key:'metrics',className:'model-grid'},
      [{value:'96.2%',label:'Test Accuracy'},{value:'2.1%',label:'False Positive Rate'},{value:'500k+',label:'Training Samples'}].map(m=>React.createElement('div',{key:m.label,className:'metric-card'},[
        React.createElement('div',{key:'v',className:'metric-value'},m.value),
        React.createElement('div',{key:'l',className:'metric-label'},m.label),
      ]))
    ),
    React.createElement('h2',{key:'ft',className:'sec-title'},'21 Detection Features'),
    React.createElement('div',{key:'fg',className:'features-grid',style:{marginTop:'0.75rem'}},FEATURES.map(f=>React.createElement('div',{key:f,className:'feature-tag'},f))),
    React.createElement('h2',{key:'ds',className:'sec-title'},'Training Data'),
    React.createElement('p',{key:'dd',className:'sec-body'},'PhiUSIIL Phishing URL Dataset (Kaggle) + PhishTank daily feed + OpenPhish community feed + Tranco top-1M benign URLs. 50/50 balanced split with temporal holdout to prevent data leakage.'),
    React.createElement('h2',{key:'mt',className:'sec-title'},'Model Architecture'),
    React.createElement('p',{key:'md',className:'sec-body'},'XGBoost gradient-boosted tree ensemble (200 estimators, max depth 6, learning rate 0.1, subsampling 0.8). Rule-based fallback engine with identical feature extraction runs when the ML model is unavailable (~91% accuracy). Homoglyph detection uses character-level matching against a curated substitution table of 12 common lookalike patterns.'),
    React.createElement('h2',{key:'lim',className:'sec-title'},'Limitations'),
    React.createElement('p',{key:'limd',className:'sec-body'},'May underperform on zero-day campaigns using legitimate cloud infrastructure (Google Sites, OneDrive). URL shorteners (bit.ly, t.co) require redirect resolution for full accuracy. WHOIS domain age data (not included in this demo) improves accuracy by ~4%.'),
    React.createElement('div',{key:'foot',style:{marginTop:'2rem',padding:'1rem',background:'var(--bg2)',borderRadius:10,border:'1px solid var(--border)',fontSize:'0.78rem',color:'var(--text3)'}},`Last updated: ${new Date().toLocaleDateString('en-US',{month:'long',year:'numeric'})} · License: Apache 2.0 · No user data is stored or transmitted.`),
  ]);
}

/* ---- MAIN APP ---- */
function App(){
  const[page,setPage]=useState('home');
  const[tab,setTab]=useState('url');
  const tabs=[{id:'url',label:'URL Scanner',icon:'🔗'},{id:'email',label:'Email Inspector',icon:'📧'},{id:'chat',label:'ChatCheck',icon:'💬'}];

  return React.createElement('div',null,[
    React.createElement('header',{key:'h',className:'header'},[
      React.createElement('div',{key:'logo',className:'logo',onClick:()=>setPage('home')},[
        React.createElement('div',{key:'s',className:'logo-shield'},'🛡'),
        React.createElement('span',{key:'t'},'AISec'),
      ]),
      React.createElement('nav',{key:'nav',className:'nav'},[
        React.createElement('button',{key:'home',className:`nav-btn${page==='home'?' active':''}`,onClick:()=>setPage('home')},'Home'),
        React.createElement('button',{key:'model',className:`nav-btn${page==='model'?' active':''}`,onClick:()=>setPage('model')},'Model Card'),
      ]),
    ]),
    page==='model'?React.createElement(ModelCard,{key:'mc'}):React.createElement('main',{key:'main'},[
      React.createElement('section',{key:'hero',className:'hero'},[
        React.createElement('div',{key:'badge',className:'hero-badge'},[React.createElement('div',{key:'p',className:'pulse'}),'AI-Powered Threat Detection']),
        React.createElement('h1',{key:'h'},['One tool. ',React.createElement('em',{key:'e'},'Three layers'),' of defense against phishing.']),
        React.createElement('p',{key:'p'},'Protect remote workers from social engineering, malicious links, and email fraud. Explainable results in plain English — no security expertise needed.'),
      ]),
      React.createElement('section',{key:'tools',className:'tool-tabs'},[
        React.createElement('div',{key:'tabs',className:'tabs-header'},
          tabs.map(t=>React.createElement('button',{key:t.id,className:`tab-btn${tab===t.id?' active':''}`,onClick:()=>setTab(t.id)},[
            React.createElement('span',{key:'i'},t.icon),
            React.createElement('span',{key:'l'},t.label),
          ]))
        ),
        React.createElement('div',{key:'card',className:'tool-card'},[
          tab==='url'&&React.createElement(URLScanner,{key:'url'}),
          tab==='email'&&React.createElement(EmailInspector,{key:'email'}),
          tab==='chat'&&React.createElement(ChatCheck,{key:'chat'}),
        ]),
      ]),
      React.createElement('footer',{key:'footer',className:'trust-bar'},
        [['No data stored','🔒'],['Trained on 500k+ threats','🧠'],['Runs entirely in your browser','⚡'],['96% detection accuracy','🎯']].map(([t,i])=>React.createElement('div',{key:t,className:'trust-item'},[
          React.createElement('span',{key:'d',className:'trust-dot'}),`${i} ${t}`
        ]))
      ),
    ]),
  ]);
}

ReactDOM.render(React.createElement(App),document.getElementById('root'));
</script>
