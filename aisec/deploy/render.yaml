services:
  - type: web
    name: aisec-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: WHOIS_API_KEY
        sync: false
    healthCheckPath: /health
    autoDeploy: true
